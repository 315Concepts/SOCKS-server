services:
  static:
    image: socks-server:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    # Behind Traefik: comment out port bindings to force container traffic through Traefik's shared backend network
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      STATIC_DIR: "/app/public"
      TRUST_PROXY: "false"
      CACHE_MAX_AGE: "1h"
      ALLOWED_ORIGINS: ""
    volumes:
      - ./public:/app/public:ro
    # Behind Traefik: uncomment to join Traefik's shared backend network
    # (and the top-level `networks:` block at the end of this file). See README.
    # networks:
    #   - traefik_backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Behind Traefik: the shared network Traefik routes over. Created outside this
# project (e.g. `docker network create traefik_backend`), hence `external`.
# networks:
#   traefik_backend:
#     external: true
